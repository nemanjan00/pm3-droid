org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8

# The Kotlin compile daemon is a separate JVM. Without an explicit heap it
# inherits whatever the launcher had, and on a constrained CI runner that
# shows up as "daemon has terminated unexpectedly on startup attempt #1"
# followed by a retry -- noisy, slow, and occasionally a hard failure.
kotlin.daemon.jvmargs=-Xmx2g
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
