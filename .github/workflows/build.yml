name: build

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  schedule:
    # 04:15 UTC daily. The point of a nightly is to catch upstream pm3
    # changes breaking the Android cross-build before a user does, so it
    # tracks PM3_REF rather than a pinned commit.
    - cron: "15 4 * * *"

env:
  # Pinned so a toolchain bump is a visible commit rather than a silent
  # change in what ships to users.
  NDK_VERSION: "27.2.12479018"
  ARM_TOOLCHAIN_VERSION: "13.3.rel1"
  PM3_REPO: RfidResearchGroup/proxmark3
  PM3_REF: master
  # The release signing certificate, as apksigner prints it. Public
  # information -- it is what a user compares to check an APK is genuinely
  # ours. Pinned here so CI fails if the APK is ever signed by a different
  # key: a missing secret is caught by the unsigned check below, but a
  # *swapped* one would otherwise sail through as a perfectly valid signature.
  EXPECTED_CERT_SHA256: "69b16fa0e2dd1327105ccbb0a0c8206519068c509f3f8b5c4ab7657c2dae0e94"

jobs:
  # ---------------------------------------------------------------------
  # The Android client, cross-compiled per ABI.
  # ---------------------------------------------------------------------
  client:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a]
    steps:
      - uses: actions/checkout@v4

      - name: Check out proxmark3
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PM3_REPO }}
          ref: ${{ env.PM3_REF }}
          path: proxmark3
          # The build reads the git history for its version string.
          fetch-depth: 0

      - name: Install NDK
        run: |
          sdk="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          [ -n "$sdk" ] || { echo "Neither ANDROID_HOME nor ANDROID_SDK_ROOT is set" >&2; exit 1; }
          yes | "$sdk/cmdline-tools/latest/bin/sdkmanager" \
            --install "ndk;${NDK_VERSION}" "cmake;3.22.1"

      - name: Install ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Build client
        env:
          PM3_SRC: ${{ github.workspace }}/proxmark3
        run: |
          # ANDROID_HOME is exported into the runner's shell, not into the
          # workflow's `env` context -- ${{ env.ANDROID_HOME }} expands to the
          # empty string, so it has to be read here instead.
          sdk="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          [ -n "$sdk" ] || { echo "Neither ANDROID_HOME nor ANDROID_SDK_ROOT is set" >&2; exit 1; }
          export ANDROID_NDK_HOME="$sdk/ndk/${NDK_VERSION}"
          [ -d "$ANDROID_NDK_HOME" ] || { echo "NDK missing at $ANDROID_NDK_HOME" >&2; ls "$sdk/ndk" || true; exit 1; }
          ./native/build-pm3.sh "${{ matrix.abi }}"

      - uses: actions/upload-artifact@v4
        with:
          name: client-${{ matrix.abi }}
          path: |
            app/src/main/jniLibs/${{ matrix.abi }}/libproxmark3.so
            app/src/main/assets/pm3-resources.zip
          if-no-files-found: error

  # ---------------------------------------------------------------------
  # The APK, assembled from the per-ABI clients above.
  # ---------------------------------------------------------------------
  apk:
    runs-on: ubuntu-latest
    needs: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Collect clients
        uses: actions/download-artifact@v4
        with:
          pattern: client-*
          path: artifacts

      - name: Stage into the app
        run: |
          # upload-artifact strips paths to their least common ancestor, so
          # each client-<abi> artifact is rooted at app/src/main -- i.e.
          # jniLibs/<abi>/libproxmark3.so and assets/pm3-resources.zip.
          #
          # Both artifacts carry an identical copy of the resource archive
          # (it is ABI-independent); the last one written wins.
          mkdir -p app/src/main/assets
          for abi in arm64-v8a armeabi-v7a; do
            mkdir -p "app/src/main/jniLibs/$abi"
            cp "artifacts/client-$abi/jniLibs/$abi/libproxmark3.so" \
               "app/src/main/jniLibs/$abi/"
            cp "artifacts/client-$abi/assets/pm3-resources.zip" \
               app/src/main/assets/
          done
          ls -lh app/src/main/jniLibs/*/ app/src/main/assets/

      - name: Unit tests
        # TagParser scrapes the client's printed output. Upstream rewords
        # those strings between releases, and a parser that quietly stops
        # matching yields blank fields rather than an error -- so this is the
        # one part of the app worth failing the build over.
        run: ./gradlew :app:testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - name: Build release APK
        # Unsigned unless a keystore secret is configured; an unsigned
        # release APK is still useful for reproducibility checks.
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          # Not a secret: an alias is not sensitive, and making it one means
          # GitHub masks that word everywhere -- an alias of "release" turns
          # every log path into app/build/outputs/apk/***/app-***.apk.
          KEY_ALIAS: ${{ vars.KEY_ALIAS || 'release' }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            # Reconstruct secrets/release.properties rather than passing
            # -Pandroid.injected.signing.*. The injected path builds its own
            # signing config and ignores the enableV1/V2/V3 settings in
            # build.gradle.kts, so CI was producing v2-only APKs while local
            # builds got v2+v3. One code path, one result.
            mkdir -p secrets
            echo "$KEYSTORE_B64" | base64 -d > secrets/release.keystore
            cat > secrets/release.properties <<EOF
          storeFile=$GITHUB_WORKSPACE/secrets/release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
            ./gradlew :app:assembleRelease
          else
            echo "No signing keystore configured; building unsigned."
            ./gradlew :app:assembleRelease
          fi

      - name: Remove signing material from the workspace
        if: always()
        run: rm -rf secrets

      - name: Verify release signature
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          # If a keystore secret was supplied, the release APK must actually
          # be signed with it. Without this the job happily uploads an
          # unsigned APK when a secret is missing or misspelled, and that is
          # only noticed by a user whose install fails.
          shopt -s nullglob
          signed=(app/build/outputs/apk/release/*-release.apk)
          unsigned=(app/build/outputs/apk/release/*-release-unsigned.apk)

          if [ -z "$KEYSTORE_B64" ]; then
            echo "No keystore secret configured; release APKs are unsigned by design."
            [ ${#unsigned[@]} -gt 0 ] || { echo "Expected unsigned APKs, found none" >&2; exit 1; }
            exit 0
          fi

          if [ ${#signed[@]} -eq 0 ]; then
            echo "KEYSTORE_B64 is set but no signed APK was produced." >&2
            echo "Check KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD." >&2
            ls -l app/build/outputs/apk/release/ >&2
            exit 1
          fi

          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          for apk in "${signed[@]}"; do
            echo "== $apk"
            out=$("$apksigner" verify --verbose --print-certs "$apk")
            echo "$out" | grep -E "^Verifies|v2 scheme|v3 scheme|certificate SHA-256"

            # apksigner labels this "Signer #1 certificate SHA-256 digest:"
            # when the schemes agree, but "V2 Signer: certificate SHA-256
            # digest:" when only some are present -- match either.
            got=$(echo "$out" \
              | sed -n 's/.*certificate SHA-256 digest: *//p' \
              | sort -u)
            if [ "$(echo "$got" | wc -l)" -ne 1 ]; then
              echo "Expected one signing certificate, found:" >&2
              echo "$got" >&2
              exit 1
            fi
            if [ "$got" != "$EXPECTED_CERT_SHA256" ]; then
              echo "Certificate mismatch for $apk" >&2
              echo "  expected $EXPECTED_CERT_SHA256" >&2
              echo "  got      $got" >&2
              echo "Either the signing secrets point at a different key, or" >&2
              echo "EXPECTED_CERT_SHA256 needs updating for a deliberate rotation." >&2
              exit 1
            fi

            # v1 is disabled on purpose; v2+v3 must both be present.
            echo "$out" | grep -q "v2 scheme (APK Signature Scheme v2): true" \
              || { echo "$apk is missing a v2 signature" >&2; exit 1; }
            echo "$out" | grep -q "v3 scheme (APK Signature Scheme v3): true" \
              || { echo "$apk is missing a v3 signature" >&2; exit 1; }
          done
          echo "All release APKs signed by the expected certificate."

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error

  # ---------------------------------------------------------------------
  # Device firmware, one job per matrix variant.
  # ---------------------------------------------------------------------
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out proxmark3
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PM3_REPO }}
          ref: ${{ env.PM3_REF }}
          path: proxmark3
          fetch-depth: 0

      - name: Install ARM toolchain
        run: |
          url="https://developer.arm.com/-/media/Files/downloads/gnu/${ARM_TOOLCHAIN_VERSION}/binrel/arm-gnu-toolchain-${ARM_TOOLCHAIN_VERSION}-x86_64-arm-none-eabi.tar.xz"
          mkdir -p "$RUNNER_TEMP/toolchains"
          curl -fL --retry 3 "$url" | tar -xJ -C "$RUNNER_TEMP/toolchains"

      - name: Build matrix
        env:
          PM3_SRC: ${{ github.workspace }}/proxmark3
        run: |
          export ARM_TOOLCHAIN="$RUNNER_TEMP/toolchains/arm-gnu-toolchain-${ARM_TOOLCHAIN_VERSION}-x86_64-arm-none-eabi"
          ./firmware/build-matrix.sh

      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            firmware/out/manifest.json
            firmware/out/*/fullimage.elf
            firmware/out/*/bootrom.elf
          if-no-files-found: error

  # ---------------------------------------------------------------------
  # Publish on a tag.
  # ---------------------------------------------------------------------
  release:
    runs-on: ubuntu-latest
    needs: [apk, firmware]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Flatten
        run: |
          mkdir -p release
          # Release APKs only. The artifact also carries the debug builds,
          # which are signed with the throwaway debug key -- publishing them
          # next to the real ones invites someone to install the wrong APK.
          find dist -path '*/release/*' -name '*-release.apk' -exec cp {} release/ \;
          if [ -z "$(ls -A release)" ]; then
            echo "No signed release APKs to publish." >&2
            echo "An unsigned APK cannot be installed, so publishing one is never useful." >&2
            echo "Configure the signing secrets: tools/push-signing-secrets.sh" >&2
            find dist -name '*.apk' >&2
            exit 1
          fi
          # Firmware images share a filename across variants, so keep the
          # variant id in the released name.
          for dir in dist/firmware/*/; do
            id=$(basename "$dir")
            [ -f "$dir/fullimage.elf" ] && cp "$dir/fullimage.elf" "release/fullimage-$id.elf"
            [ -f "$dir/bootrom.elf" ] && cp "$dir/bootrom.elf" "release/bootrom-$id.elf"
          done
          cp dist/firmware/manifest.json release/ 2>/dev/null || true
          ls -lh release

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true

  # ---------------------------------------------------------------------
  # Nightly: republish the rolling `nightly` prerelease.
  #
  # Runs on every push to the default branch, plus the daily schedule and
  # manual runs. Pull requests never publish -- a fork's token cannot write
  # here anyway, and a PR has no business moving the tag.
  # ---------------------------------------------------------------------
  nightly:
    runs-on: ubuntu-latest
    needs: [apk, firmware]
    # Compared against the repository's actual default branch rather than a
    # hardcoded "master": the push trigger accepts master or main, so pinning
    # one here means a branch rename silently stops nightlies.
    #
    # A v* tag push does not match -- github.ref is refs/tags/* there, and
    # that is the `release` job's business.
    if: >-
      github.event_name == 'schedule' ||
      ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
       github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    permissions:
      contents: write
    # Two pushes in quick succession would otherwise race on the same tag and
    # release. Queued rather than cancelled: cancelling mid-publish can leave
    # the release half-uploaded.
    concurrency:
      group: nightly-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Flatten
        run: |
          mkdir -p release
          # Release APKs only. The artifact also carries the debug builds,
          # which are signed with the throwaway debug key -- publishing them
          # next to the real ones invites someone to install the wrong APK.
          find dist -path '*/release/*' -name '*-release.apk' -exec cp {} release/ \;
          if [ -z "$(ls -A release)" ]; then
            echo "No signed release APKs to publish." >&2
            echo "An unsigned APK cannot be installed, so publishing one is never useful." >&2
            echo "Configure the signing secrets: tools/push-signing-secrets.sh" >&2
            find dist -name '*.apk' >&2
            exit 1
          fi
          for dir in dist/firmware/*/; do
            id=$(basename "$dir")
            [ -f "$dir/fullimage.elf" ] && cp "$dir/fullimage.elf" "release/fullimage-$id.elf"
            [ -f "$dir/bootrom.elf" ] && cp "$dir/bootrom.elf" "release/bootrom-$id.elf"
          done
          cp dist/firmware/manifest.json release/ 2>/dev/null || true
          ls -lh release

      - name: Move the nightly tag
        run: |
          # Repoint the rolling tag at this commit. The release itself is
          # updated in place by the next step rather than deleted and
          # recreated: deleting leaves a window with no nightly at all, and
          # on every-commit publishing that window is hit often. Asset names
          # are stable, so re-uploading overwrites rather than accumulates.
          git tag -f nightly
          git push -f origin nightly

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: "Nightly (${{ github.sha }})"
          body: |
            Rolling build of the default branch, republished on every commit
            and rebuilt daily against `${{ env.PM3_REPO }}@${{ env.PM3_REF }}`.

            Commit `${{ github.sha }}`.

            APKs are signed with the project release key. Pick the APK
            matching your device's ABI, or `universal` if unsure.

            Untested against hardware by CI -- treat the firmware here as
            unverified, and prefer a tagged release if one exists.
          prerelease: true
          # Never let a nightly displace a tagged release as "Latest"; the
          # app's firmware download resolves /releases/latest/download.
          make_latest: false
          files: release/*
