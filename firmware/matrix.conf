# Firmware build matrix -- one variant per line, '|' separated.
#
#   id | PLATFORM | PLATFORM_EXTRAS | extra make vars | description
#
# '|' rather than tab: tab is IFS whitespace, so bash `read` would collapse
# consecutive tabs and silently shift every field after an empty one.
#
# BTADDON is what enables the Blueshark (HC-05, BT classic SPP) add-on on a
# PM3 -- without it the module powers up but the client cannot talk over it.
# BWM enables forwarding to the Proxmark5 Battery Wireless Module (BLE).
#
rdv4        | PM3RDV4    |         |                     | RDV4, USB only
rdv4-bt     | PM3RDV4    | BTADDON |                     | RDV4 with Blueshark (BT classic)
easy        | PM3GENERIC |         | LED_ORDER=PM3EASY   | PM3 Easy, USB only
easy-bt     | PM3GENERIC | BTADDON | LED_ORDER=PM3EASY   | PM3 Easy with Blueshark (BT classic)
generic     | PM3GENERIC |         |                     | RDV1/RDV2/rysccorps, USB only
generic-bt  | PM3GENERIC | BTADDON |                     | RDV1/RDV2/rysccorps with Blueshark
icopyx      | PM3ICOPYX  | FLASH   |                     | ICOPY-X / PM3 Max
ultimate    | PM3ULTIMATE |        |                     | PM3 Ultimate
pm5         | PM5        |         |                     | Proxmark5, USB only
pm5-bwm     | PM5        | BWM     |                     | Proxmark5 with BWM (BLE)
